<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بلک نت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0e0f12;
      color: #ffffff;
      direction: rtl;
      padding: 16px;
      padding-bottom: 85px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* نوار بالا */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181920;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid #282936;
    }
    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #00d2ff;
      font-size: 15px;
    }

    /* صفحه فروشگاه */
    #tab-shop {
      display: block;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }
    .product-card {
      background: #181920;
      border: 1px solid #282936;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-card h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }
    .product-card p {
      font-size: 13px;
      color: #2ed573;
      font-weight: bold;
    }
    .buy-btn {
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* صفحه بازی و اسپین */
    #tab-spin {
      display: none;
    }
    .boxes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .box-card {
      background: #181920;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
    }
    .box-card.free { border: 1px solid #ffd700; }
    .box-card.premium { border: 1px solid #8a2be2; }
    .box-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .badge-gold { background: #ffd700; color: #000; }
    .badge-purple { background: #8a2be2; color: #fff; }
    .box-icon { font-size: 42px; margin-top: 4px; }
    .box-title { font-size: 14px; font-weight: bold; }
    .box-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      color: #fff;
    }
    .btn-gold { background: #e1b12c; }
    .btn-purple { background: #7158e2; }

    /* نمای اجرای اسپین رول */
    #spin-screen {
      display: none;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .back-btn {
      align-self: flex-start;
      background: #252634;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .roulette-container {
      position: relative;
      width: 100%;
      height: 110px;
      background: #121318;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #2d2f3f;
    }
    .roulette-pointer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #ff4757;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px #ff4757;
    }
    .roulette-track {
      display: flex;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }
    .roulette-item {
      width: 90px;
      height: 90px;
      margin: 10px 5px;
      background: #1e1f29;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #323547;
    }
    .roulette-item span { font-size: 28px; }
    .roulette-item p { font-size: 11px; margin-top: 4px; color: #ddd; }

    .roll-btn {
      width: 100%;
      background: #ffa502;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
    }
    .roll-btn:disabled {
      background: #444;
      color: #777;
      cursor: not-allowed;
    }

    /* نوار پایین صفحه */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #14151a;
      border-top: 1px solid #23242e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .bottom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #747d8c;
      font-size: 12px;
      cursor: pointer;
      width: 45%;
    }
    .bottom-btn.active {
      color: #00a8ff;
    }
    .bottom-btn span {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- نوار بالای صفحه -->
  <div class="top-bar">
    <span>بلک نت | BlackNet</span>
    <div class="balance-badge">
      <span>💎</span>
      <span id="user-balance">100</span>
    </div>
  </div>

  <!-- تب فروشگاه -->
  <div id="tab-shop">
    <h3>محصولات مجازی</h3>
    <div class="product-list">
      <div class="product-card">
        <div>
          <h3>فیلترشکن مستر ادیشن (۱ ماهه)</h3>
          <p>۱۵۰,۰۰۰ تومان</p>
        </div>
        <button class="buy-btn" onclick="buyItem('مستر ادیشن ۱ ماهه')">خرید</button>
      </div>

      <div class="product-card">
        <div>
          <h3>اکانت گوگل جیمینای پرو</h3>
          <p>۲۸۰,۰۰۰ تومان</p>
        </div>
        <button class="buy-btn" onclick="buyItem('جیمینای پرو')">خرید</button>
      </div>

      <div class="product-card">
        <div>
          <h3>کانفیگ اختصاصی VIP</h3>
          <p>۲۰۰,۰۰۰ تومان</p>
        </div>
        <button class="buy-btn" onclick="buyItem('کانفیگ VIP')">خرید</button>
      </div>
    </div>
  </div>

  <!-- تب بازی و اسپین -->
  <div id="tab-spin">
    <div id="spin-lobby">
      <h3>جعبه‌های جوایز</h3>
      <div class="boxes-grid">
        <div class="box-card free" onclick="openBox('free')">
          <span class="box-badge badge-gold">روزانه</span>
          <div class="box-icon">🎁</div>
          <div class="box-title">اسپین رایگان</div>
          <button class="box-btn btn-gold">ورود رایگان</button>
        </div>

        <div class="box-card premium" onclick="openBox('vip')">
          <span class="box-badge badge-purple">VIP</span>
          <div class="box-icon">👑</div>
          <div class="box-title">اسپین پولی</div>
          <button class="box-btn btn-purple">۱۰ الماس</button>
        </div>
      </div>
    </div>

    <!-- صفحه رول اسپین -->
    <div id="spin-screen">
      <button class="back-btn" onclick="backToLobby()">⬅ بازگشت به جعبه‌ها</button>
      <h3 id="box-title">جعبه جوایز</h3>

      <div class="roulette-container">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="roulette-track"></div>
      </div>

      <button id="roll-button" class="roll-btn" onclick="startRoll()">باز کردن جعبه</button>
    </div>
  </div>

  <!-- نوار منوی پایین -->
  <div class="bottom-bar">
    <button id="btn-tab-shop" class="bottom-btn active" onclick="switchTab('shop')">
      <span>🛒</span>
      فروشگاه
    </button>
    <button id="btn-tab-spin" class="bottom-btn" onclick="switchTab('spin')">
      <span>🎁</span>
      بازی و اسپین
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let balance = 100;
    let currentMode = "free";
    let isRolling = false;

    const spinPrizes = [
      { name: "کانفیگ ۱ ماهه", icon: "🚀" },
      { name: "اکانت پرو", icon: "✨" },
      { name: "پوچ", icon: "💩" },
      { name: "تخفیف ۵۰٪", icon: "🏷️" },
      { name: "۵۰ الماس", icon: "💎" },
      { name: "کانفیگ VIP", icon: "⚡" },
      { name: "شانس مجدد", icon: "🔄" }
    ];

    function buyItem(name) {
      if (tg?.showPopup) {
        tg.showPopup({
          title: "خرید محصول",
          message: `آیا مایل به خرید ${name} هستید؟`,
          buttons: [{ type: "ok", text: "تایید" }, { type: "cancel" }]
        });
      } else {
        alert("سفارش شما ثبت شد: " + name);
      }
    }

    // جابه‌جایی تب‌ها با کلیک روی منوی پایین
    function switchTab(tab) {
      const shopTab = document.getElementById("tab-shop");
      const spinTab = document.getElementById("tab-spin");
      const btnShop = document.getElementById("btn-tab-shop");
      const btnSpin = document.getElementById("btn-tab-spin");

      if (tab === "shop") {
        shopTab.style.display = "block";
        spinTab.style.display = "none";
        btnShop.classList.add("active");
        btnSpin.classList.remove("active");
      } else {
        shopTab.style.display = "none";
        spinTab.style.display = "block";
        btnSpin.classList.add("active");
        btnShop.classList.remove("active");
      }
    }

    function openBox(mode) {
      currentMode = mode;
      document.getElementById("spin-lobby").style.display = "none";
      document.getElementById("spin-screen").style.display = "flex";
      document.getElementById("box-title").innerText = mode === "free" ? "اسپین رایگان روزانه" : "اسپین پولی VIP";
      generateTrack();
    }

    function backToLobby() {
      if (isRolling) return;
      document.getElementById("spin-screen").style.display = "none";
      document.getElementById("spin-lobby").style.display = "block";
    }

    function generateTrack() {
      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      for (let i = 0; i < 50; i++) {
        const prize = spinPrizes[Math.floor(Math.random() * spinPrizes.length)];
        const el = document.createElement("div");
        el.className = "roulette-item";
        el.innerHTML = `<span>${prize.icon}</span><p>${prize.name}</p>`;
        track.appendChild(el);
      }
    }

    function startRoll() {
      if (isRolling) return;

      if (currentMode === "vip" && balance < 10) {
        alert("موجودی شما کافی نیست!");
        return;
      }

      if (currentMode === "vip") {
        balance -= 10;
        document.getElementById("user-balance").innerText = balance;
      }

      isRolling = true;
      const btn = document.getElementById("roll-button");
      btn.disabled = true;

      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";

      const targetIndex = Math.floor(Math.random() * 8) + 35;
      const itemWidth = 100;
      const containerWidth = document.querySelector(".roulette-container").offsetWidth;
      const stopAt = (targetIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2);

      setTimeout(() => {
        track.style.transition = "transform 5s cubic-bezier(0.1, 0.85, 0.25, 1)";
        track.style.transform = `translateX(${stopAt}px)`;
      }, 50);

      setTimeout(() => {
        isRolling = false;
        btn.disabled = false;
        const winner = track.children[targetIndex];
        const prizeName = winner.querySelector("p").innerText;

        if (tg?.showAlert) {
          tg.showAlert(`🎉 برنده شدید: ${prizeName}`);
        } else {
          alert(`🎉 برنده شدید: ${prizeName}`);
        }
      }, 5300);
    }
  </script>
</body>
  </html>

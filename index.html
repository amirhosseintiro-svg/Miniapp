<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه بلک نت</title>
  <!-- اسکریپت وب‌اپ تلگرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
      direction: rtl;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 22px;
      color: #0088cc;
      margin-bottom: 6px;
    }
    header p {
      font-size: 13px;
      color: #aaa;
    }
    #product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .product-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .product-card h3 {
      font-size: 16px;
      color: #fff;
    }
    .product-card p {
      font-size: 14px;
      color: #4cd964;
      font-weight: bold;
    }
    .product-card button {
      background-color: #0088cc;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .product-card button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>فروشگاه محصولات مجازی</h1>
    <p>محصول مورد نظر خود را انتخاب کنید</p>
  </header>

  <main id="product-list">
    <!-- محصولات توسط جاوااسکریپت اینجا اضافه می‌شوند -->
  </main>

  <!-- اتصال به فایل جاوااسکریپت داخل پوشه js -->
  <script src="js/shop.js"></script>
</body>
</html>

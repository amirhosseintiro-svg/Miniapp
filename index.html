<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Black Item</title>
  <!-- اسکریپت وب‌اپ تلگرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- استایل‌ها -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هدر اپلیکیشن -->
  <header class="app-header">
    <div class="user-info">
      <div class="avatar" id="user-avatar">👤</div>
      <span class="username" id="user-name">کاربر</span>
    </div>
    <div class="brand-title" id="app-title">Black Item</div>
    <div class="user-balance">
      <span id="balance-amount">0</span> 💰
    </div>
  </header>

  <!-- محتوای اصلی و گرید آیتم‌ها -->
  <main class="content-area">
    <div class="items-grid" id="products-container">
      <!-- محصولات از طریق جاوااسکریپت اینجا چیده می‌شوند -->
    </div>
  </main>

  <!-- نوار ناوبری پایین -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item" data-tab="profile">👤 <span>پروفایل</span></button>
    <button class="nav-item" data-tab="task">📋 <span>Task</span></button>
    <button class="nav-item active" data-tab="shop">🛍️ <span>فروشگاه</span></button>
    <button class="nav-item" data-tab="game">🎮 <span>بازی</span></button>
    <button class="nav-item" data-tab="wallet">💳 <span>کیف پول</span></button>
  </nav>

  <!-- دکمه شناور چرخ‌دنده (مخصوص ادمین) -->
  <button id="admin-gear-btn" class="admin-fab hidden">⚙️</button>

  <!-- پنجره مودال پنل مدیریت -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>پنل مدیریت فوق پیشرفته</h3>
        <button id="close-admin">✖</button>
      </div>
      <div class="modal-body">
        <label>عنوان مینی‌اپ:</label>
        <input type="text" id="cfg-app-title">

        <label>رنگ پس‌زمینه اصلی:</label>
        <input type="color" id="cfg-bg-color">

        <label>رنگ کارت‌ها:</label>
        <input type="color" id="cfg-card-color">

        <label>رنگ متن‌ها:</label>
        <input type="color" id="cfg-text-color">

        <hr>
        <h4>افزودن محصول جدید</h4>
        <input type="text" id="new-prod-title" placeholder="نام محصول">
        <input type="text" id="new-prod-desc" placeholder="توضیحات کوتاه">
        <input type="text" id="new-prod-price" placeholder="قیمت (مثلاً 50$)">
        <input type="text" id="new-prod-img" placeholder="لینک عکس محصول">
        <button id="add-product-btn" class="action-btn">افزودن محصول</button>

        <hr>
        <button id="save-settings-btn" class="save-btn">💾 ذخیره تمام تغییرات</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

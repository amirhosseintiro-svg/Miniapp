<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Black Item</title>
  <!-- فونت آیکون فوق‌العاده باکیفیت Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هدر -->
  <header class="app-header">
    <div class="user-info">
      <div class="avatar" id="user-avatar">👤</div>
      <span class="username" id="user-name">کاربر</span>
    </div>
    <div class="brand-title" id="app-title">Black Item</div>
    <div class="user-balance">
      <span id="balance-amount">0</span> 💰
    </div>
  </header>

  <!-- محتوا -->
  <main class="content-area">
    <div class="items-grid" id="products-container"></div>
  </main>

  <!-- نوار ناوبری پایین -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- دکمه شناور ادمین -->
  <button id="admin-gear-btn" class="admin-fab hidden">⚙️</button>

  <!-- پنل مدیریت -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>تنظیمات فوق پیشرفته</h3>
        <button id="close-admin">✖</button>
      </div>
      <div class="modal-body">
        <h4>🎨 ظاهر و رنگ‌ها</h4>
        <label>عنوان مینی‌اپ:</label>
        <input type="text" id="cfg-app-title">

        <label>رنگ پس‌زمینه:</label>
        <input type="color" id="cfg-bg-color">

        <label>رنگ کارت‌ها:</label>
        <input type="color" id="cfg-card-color">

        <label>رنگ متن‌ها:</label>
        <input type="color" id="cfg-text-color">

        <label>رنگ تب فعال ناوبری:</label>
        <input type="color" id="cfg-nav-active-color">

        <hr>
        <h4>🧭 مدیریت منوی پایین (آیکون، لینک عکس یا کلاس RemixIcon)</h4>
        
        <label>تب ۱ (پروفایل):</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="tab-icon-0" style="flex: 1;" placeholder="آیکون / لینک">
          <input type="text" id="tab-label-0" style="flex: 1;" placeholder="نام">
        </div>

        <label>تب ۲ (تسک):</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="tab-icon-1" style="flex: 1;" placeholder="آیکون / لینک">
          <input type="text" id="tab-label-1" style="flex: 1;" placeholder="نام">
        </div>

        <label>تب ۳ (فروشگاه):</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="tab-icon-2" style="flex: 1;" placeholder="آیکون / لینک">
          <input type="text" id="tab-label-2" style="flex: 1;" placeholder="نام">
        </div>

        <label>تب ۴ (بازی):</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="tab-icon-3" style="flex: 1;" placeholder="آیکون / لینک">
          <input type="text" id="tab-label-3" style="flex: 1;" placeholder="نام">
        </div>

        <label>تب ۵ (کیف پول):</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="tab-icon-4" style="flex: 1;" placeholder="آیکون / لینک">
          <input type="text" id="tab-label-4" style="flex: 1;" placeholder="نام">
        </div>

        <hr>
        <h4>🛍️ افزودن محصول</h4>
        <input type="text" id="new-prod-title" placeholder="نام محصول">
        <input type="text" id="new-prod-desc" placeholder="توضیحات کوتاه">
        <input type="text" id="new-prod-price" placeholder="قیمت (مثلاً 50$)">
        <input type="text" id="new-prod-img" placeholder="لینک عکس محصول">
        <button id="add-product-btn" class="action-btn">افزودن محصول</button>

        <hr>
        <button id="save-settings-btn" class="save-btn">💾 ذخیره تمام تغییرات</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بلک نت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #0c0d14; color: #fff; padding: 16px 16px 90px; user-select: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #151724; padding: 12px 16px; border-radius: 14px; margin-bottom: 18px; border: 1px solid #23273c; }
    .balance-box { color: #00d2ff; font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    
    /* تب فروشگاه */
    #tab-shop { display: block; }
    .product-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .product-card { background: #151724; border: 1px solid #23273c; border-radius: 14px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .product-card h3 { font-size: 15px; margin-bottom: 6px; }
    .product-card p { font-size: 13px; color: #2ed573; font-weight: bold; }
    .buy-btn { background: #0088cc; color: #fff; border: none; padding: 9px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    
    /* تب بازی و اسپین */
    #tab-spin { display: none; }
    .boxes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .box-card { background: #151724; border-radius: 16px; padding: 18px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; }
    .box-card.free { border: 1px solid #e1b12c; }
    .box-card.premium { border: 1px solid #8854d0; }
    .box-icon { font-size: 46px; }
    .box-title { font-size: 14px; font-weight: bold; }
    .box-btn { width: 100%; padding: 9px 0; border-radius: 10px; border: none; font-weight: bold; color: #fff; }
    .btn-gold { background: #e1b12c; }
    .btn-purple { background: #8854d0; }
    
    #spin-screen { display: none; flex-direction: column; gap: 20px; align-items: center; }
    .back-btn { align-self: flex-start; background: #23273c; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .roulette-container { position: relative; width: 100%; height: 130px; background: #090a0f; border-radius: 18px; overflow: hidden; border: 2px solid #282c44; direction: ltr; }
    .roulette-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ff4757; transform: translateX(-50%); z-index: 20; box-shadow: 0 0 12px #ff4757; }
    .roulette-track { display: flex; align-items: center; height: 100%; position: absolute; left: 0; top: 0; will-change: transform; }
    .roulette-item { width: 100px; height: 105px; margin: 0 5px; background: linear-gradient(180deg, #1f2335 0%, #131522 100%); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid #313652; }
    .roulette-item span { font-size: 34px; margin-bottom: 4px; }
    .roulette-item p { font-size: 11px; color: #e1e3ec; text-align: center; font-weight: bold; }
    .roll-btn { width: 100%; background: linear-gradient(90deg, #ff9f43, #ee5253); border: none; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; }
    .roll-btn:disabled { background: #333647; color: #666a80; cursor: not-allowed; }

    /* تب مخفی ادمین */
    #tab-admin { display: none; }
    .admin-box { background: #151724; border: 1px solid #ff4757; border-radius: 14px; padding: 14px; margin-top: 14px; }
    .admin-input { width: 100%; background: #0c0d14; border: 1px solid #23273c; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .admin-add-btn { width: 100%; background: #2ed573; border: none; color: #fff; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* نوار پایین */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #12141f; border-top: 1px solid #23273c; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .bottom-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #6c7293; font-size: 12px; cursor: pointer; }
    .bottom-btn.active { color: #00d2ff; }
    .bottom-btn span { font-size: 20px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span>بلک نت | BlackNet</span>
    <div class="balance-box"><span>💎</span><span id="user-balance">100</span></div>
  </div>

  <!-- تب فروشگاه -->
  <div id="tab-shop">
    <h3>فروشگاه محصولات مجازی</h3>
    <div class="product-list" id="product-container"></div>
  </div>

  <!-- تب بازی -->
  <div id="tab-spin">
    <div id="spin-lobby">
      <h3>جعبه‌های جوایز</h3>
      <div class="boxes-grid">
        <div class="box-card free" onclick="openBox('free')">
          <div class="box-icon">🎁</div><div class="box-title">جعبه رایگان روزانه</div>
          <button class="box-btn btn-gold">باز کردن رایگان</button>
        </div>
        <div class="box-card premium" onclick="openBox('vip')">
          <div class="box-icon">👑</div><div class="box-title">جعبه پولی VIP</div>
          <button class="box-btn btn-purple">۱۰ الماس</button>
        </div>
      </div>
    </div>

    <div id="spin-screen">
      <button class="back-btn" onclick="backToLobby()">⬅ بازگشت به جعبه‌ها</button>
      <h3 id="box-title">جعبه جوایز</h3>
      <div class="roulette-container" id="roulette-container">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="roulette-track"></div>
      </div>
      <button id="roll-button" class="roll-btn" onclick="startRoll()">شروع چرخش</button>
    </div>
  </div>

  <!-- تب اختصاصی ادمین -->
  <div id="tab-admin">
    <h3 style="color: #ff4757;">پنل مدیریت بلک نت</h3>
    <div class="admin-box">
      <input type="text" id="new-prod-name" class="admin-input" placeholder="نام محصول جدید (مثلاً: کانفیگ ۲ ماهه)">
      <input type="text" id="new-prod-price" class="admin-input" placeholder="قیمت (مثلاً: ۲۵۰,۰۰۰ تومان)">
      <button class="admin-add-btn" onclick="addProduct()">➕ افزودن به فروشگاه</button>
    </div>
  </div>

  <!-- منوی پایین -->
  <div class="bottom-bar">
    <button id="btn-tab-shop" class="bottom-btn active" onclick="switchTab('shop')"><span>🛒</span>فروشگاه</button>
    <button id="btn-tab-spin" class="bottom-btn" onclick="switchTab('spin')"><span>🎁</span>بازی و اسپین</button>
    <button id="btn-tab-admin" class="bottom-btn" style="display: none;" onclick="switchTab('admin')"><span>⚙️</span>مدیریت</button>
  </div>
    <script>
    const BOT_TOKEN = "8418244556:AAFy6h9Rdwrp2F5EttzsKChMfjMbA4fcJtM";
    const ADMIN_ID = "1309025996";

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // محصولات ذخیره شده در حافظه مرورگر
    let products = JSON.parse(localStorage.getItem("bn_products")) || [
      { name: "فیلترشکن مستر ادیشن (۱ ماهه)", price: "۱۵۰,۰۰۰ تومان" },
      { name: "اکانت گوگل جیمینای پرو", price: "۲۸۰,۰۰۰ تومان" },
      { name: "کانفیگ اختصاصی VIP", price: "۲۰۰,۰۰۰ تومان" }
    ];

    let balance = 100;
    let currentMode = "free";
    let isRolling = false;

    const spinPrizes = [
      { name: "کانفیگ ۱ ماهه", icon: "🚀" },
      { name: "اکانت پرو", icon: "✨" },
      { name: "پوچ", icon: "💩" },
      { name: "تخفیف ۵۰٪", icon: "🏷️" },
      { name: "۵۰ الماس", icon: "💎" },
      { name: "کانفیگ VIP", icon: "⚡" },
      { name: "شانس دوباره", icon: "🔄" }
    ];

    // بررسی ورود ادمین اصلی
    const currentUser = tg?.initDataUnsafe?.user;
    if (currentUser && String(currentUser.id) === ADMIN_ID) {
      document.getElementById("btn-tab-admin").style.display = "flex";
    }

    function renderProducts() {
      const container = document.getElementById("product-container");
      container.innerHTML = "";
      products.forEach((p, idx) => {
        container.innerHTML += `
          <div class="product-card">
            <div>
              <h3>${p.name}</h3>
              <p>${p.price}</p>
            </div>
            <button class="buy-btn" onclick="buyItem('${p.name}')">خرید</button>
          </div>
        `;
      });
    }
    renderProducts();

    // افزودن محصول از پنل ادمین
    function addProduct() {
      const name = document.getElementById("new-prod-name").value.trim();
      const price = document.getElementById("new-prod-price").value.trim();
      if (!name || !price) { alert("نام و قیمت را وارد کنید!"); return; }
      products.push({ name, price });
      localStorage.setItem("bn_products", JSON.stringify(products));
      renderProducts();
      document.getElementById("new-prod-name").value = "";
      document.getElementById("new-prod-price").value = "";
      alert("محصول با موفقیت اضافه شد!");
      switchTab('shop');
    }

    // ارسال مستقیم اعلان به پی‌وی تلگرام ادمین
    function sendDirectAlert(actionType, textPayload) {
      const userName = currentUser?.first_name || "کاربر تستی";
      const userId = currentUser?.id || "ناشناس";

      let msg = "";
      if (actionType === "buy") {
        msg = `🛒 <b>سفارش جدید در بلک نت!</b>\n\n👤 خریدار: ${userName} (<code>${userId}</code>)\n📦 محصول: <b>${textPayload}</b>`;
      } else if (actionType === "spin") {
        msg = `🎁 <b>برنده گردونه شانس!</b>\n\n👤 کاربر: ${userName} (<code>${userId}</code>)\n🎉 جایزه: <b>${textPayload}</b>`;
      }

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: "HTML" })
      }).catch(err => console.error(err));
    }

    function buyItem(name) {
      sendDirectAlert("buy", name);
      if (tg?.showPopup) {
        tg.showPopup({ title: "ثبت سفارش", message: `سفارش ${name} ارسال شد و به زودی تحویل داده می‌شود!`, buttons: [{ type: "ok", text: "باشه" }] });
      } else {
        alert(`سفارش ${name} برای ادمین ارسال شد!`);
      }
    }

    function switchTab(tab) {
      const tabs = ["shop", "spin", "admin"];
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`btn-tab-${t}`);
        if (el) el.style.display = (t === tab) ? "block" : "none";
        if (btn) btn.classList.toggle("active", t === tab);
      });
    }

    function openBox(mode) {
      currentMode = mode;
      document.getElementById("spin-lobby").style.display = "none";
      document.getElementById("spin-screen").style.display = "flex";
      document.getElementById("box-title").innerText = mode === "free" ? "جعبه رایگان روزانه" : "جعبه پولی VIP";
      generateTrack();
    }

    function backToLobby() {
      if (isRolling) return;
      document.getElementById("spin-screen").style.display = "none";
      document.getElementById("spin-lobby").style.display = "block";
    }

    function generateTrack() {
      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      for (let i = 0; i < 70; i++) {
        const prize = spinPrizes[Math.floor(Math.random() * spinPrizes.length)];
        const el = document.createElement("div");
        el.className = "roulette-item";
        el.innerHTML = `<span>${prize.icon}</span><p>${prize.name}</p>`;
        track.appendChild(el);
      }
    }

    function startRoll() {
      if (isRolling) return;
      if (currentMode === "vip" && balance < 10) { alert("موجودی کم است!"); return; }

      if (currentMode === "vip") {
        balance -= 10;
        document.getElementById("user-balance").innerText = balance;
      }

      isRolling = true;
      const btn = document.getElementById("roll-button");
      btn.disabled = true;

      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";

      const targetIndex = Math.floor(Math.random() * 10) + 50;
      const itemWidth = 110;
      const containerWidth = document.getElementById("roulette-container").offsetWidth;
      const stopAt = -((targetIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2));

      setTimeout(() => {
        track.style.transition = "transform 6.5s cubic-bezier(0.15, 0.9, 0.25, 1)";
        track.style.transform = `translateX(${stopAt}px)`;
      }, 50);

      setTimeout(() => {
        isRolling = false;
        btn.disabled = false;
        const winner = track.children[targetIndex];
        const prizeName = winner.querySelector("p").innerText;

        sendDirectAlert("spin", prizeName);

        if (tg?.showAlert) {
          tg.showAlert(`🎉 تبریک! شما برنده «${prizeName}» شدید!`);
        } else {
          alert(`🎉 تبریک! شما برنده «${prizeName}» شدید!`);
        }
      }, 6800);
    }
  </script>
</body>
</html>

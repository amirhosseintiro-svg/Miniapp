<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بلک نت | BlackNet Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090a10;
      --card-bg: rgba(21, 23, 36, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --gold: #f5af19;
      --gold-glow: rgba(245, 175, 25, 0.4);
      --purple: #8e2de2;
      --danger: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #171b30 0%, #090a10 70%);
      color: #fff;
      padding: 16px 16px 95px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    /* نوار هدر مدرن */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 18px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      color: #fff;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: bold;
    }
    .balance-pill {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      color: var(--accent);
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* عناوین بخش‌ها */
    .section-header {
      font-size: 15px;
      font-weight: 700;
      color: #a4b0be;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* کارت‌های فروشگاه */
    #tab-shop { display: block; }
    .product-list { display: flex; flex-direction: column; gap: 14px; }
    .product-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }
    .product-card:active { transform: scale(0.98); }
    .product-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .product-info p {
      font-size: 14px;
      color: #2ed573;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .buy-btn {
      background: linear-gradient(135deg, #00d2ff, #0072ff);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.35);
      transition: all 0.2s ease;
    }
    .buy-btn:active { transform: scale(0.92); }

    /* تب جعبه‌ها */
    #tab-spin { display: none; }
    .boxes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .box-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 22px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
      position: relative;
    }
    .box-card:active { transform: scale(0.96); }
    .box-card.free {
      border-color: rgba(245, 175, 25, 0.3);
      box-shadow: 0 8px 25px var(--gold-glow);
    }
    .box-card.premium {
      border-color: rgba(142, 45, 226, 0.4);
      box-shadow: 0 8px 25px rgba(142, 45, 226, 0.3);
    }
    .box-icon {
      font-size: 52px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
      animation: float 3s ease-in-out infinite alternate;
    }
    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-6px); }
    }
    .box-title { font-size: 14px; font-weight: 800; }
    .box-btn {
      width: 100%;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
    }
    .btn-gold { background: linear-gradient(135deg, #f5af19, #e65c00); box-shadow: 0 4px 15px var(--gold-glow); }
    .btn-purple { background: linear-gradient(135deg, #8e2de2, #4a00e0); box-shadow: 0 4px 15px rgba(142, 45, 226, 0.4); }

    /* صفحه باز کردن جعبه و گردونه */
    #spin-screen { display: none; flex-direction: column; gap: 22px; align-items: center; }
    .back-btn {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ماژول رول افقی */
    .roulette-container {
      position: relative;
      width: 100%;
      height: 140px;
      background: #06070a;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
      direction: ltr;
    }
    .roulette-pointer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: #ff3838;
      transform: translateX(-50%);
      z-index: 30;
      box-shadow: 0 0 14px #ff3838, 0 0 25px #ff3838;
    }
    .roulette-pointer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #ff3838;
    }
    .roulette-pointer::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 10px solid #ff3838;
    }
    .roulette-track {
      display: flex;
      align-items: center;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
    }
    .roulette-item {
      width: 105px;
      height: 115px;
      margin: 0 5px;
      background: linear-gradient(180deg, #181b2a 0%, #0d0f17 100%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }
    .roulette-item span { font-size: 38px; margin-bottom: 6px; }
    .roulette-item p { font-size: 11px; color: #ced6e0; text-align: center; font-weight: 700; padding: 0 4px; }

    .roll-btn {
      width: 100%;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(255, 65, 108, 0.4);
      transition: all 0.2s ease;
    }
    .roll-btn:active { transform: scale(0.98); }
    .roll-btn:disabled {
      background: #252837;
      color: #57606f;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* پاپ‌آپ جایزه */
    .win-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    .win-card {
      background: #151724;
      border: 1px solid var(--accent);
      box-shadow: 0 0 35px var(--accent-glow);
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      animation: popUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popUp { from { transform: scale(0.7); } to { transform: scale(1); } }
    .win-icon { font-size: 64px; margin-bottom: 12px; }
    .win-name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 20px; }
    .win-close-btn {
      background: var(--accent);
      color: #000;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* پنل مدیریت ادمین */
    #tab-admin { display: none; }
    .admin-box {
      background: var(--card-bg);
      border: 1px solid var(--danger);
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.2);
      border-radius: 18px;
      padding: 18px;
    }
    .admin-input {
      width: 100%;
      background: #090a10;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .admin-add-btn {
      width: 100%;
      background: #2ed573;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* نوار ناوبری پایین */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: rgba(18, 20, 31, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .bottom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: #747d8c;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .bottom-btn.active { color: var(--accent); }
    .bottom-btn span { font-size: 22px; }
  </style>
</head>
<body>

  <!-- هدر اپلیکیشن -->
  <div class="header-bar">
    <div class="brand-title">
      <span>بلک نت</span>
      <span class="brand-badge">PRO</span>
    </div>
    <div class="balance-box balance-pill">
      <span>💎</span>
      <span id="user-balance">100</span>
    </div>
  </div>

  <!-- تب فروشگاه -->
  <div id="tab-shop">
    <div class="section-header">🛒 محصولات ویژه</div>
    <div class="product-list" id="product-container"></div>
  </div>

  <!-- تب جعبه‌ها و گردونه -->
  <div id="tab-spin">
    <div id="spin-lobby">
      <div class="section-header">🎁 جعبه‌های شانس روزانه</div>
      <div class="boxes-grid">
        <div class="box-card free" onclick="openBox('free')">
          <div class="box-icon">📦</div>
          <div class="box-title">جعبه رایگان</div>
          <button class="box-btn btn-gold">باز کردن رایگان</button>
        </div>
        <div class="box-card premium" onclick="openBox('vip')">
          <div class="box-icon">👑</div>
          <div class="box-title">جعبه VIP</div>
          <button class="box-btn btn-purple">۱۰ الماس</button>
        </div>
      </div>
    </div>

    <!-- مانیتور گردونه افقی -->
    <div id="spin-screen">
      <button class="back-btn" onclick="backToLobby()">⬅ بازگشت</button>
      <h3 id="box-title" style="font-weight: 800;">جعبه جوایز</h3>
      
      <div class="roulette-container" id="roulette-container">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="roulette-track"></div>
      </div>

      <button id="roll-button" class="roll-btn" onclick="startRoll()">چرخش گردونه</button>
    </div>
  </div>

  <!-- پنل مخفی ادمین -->
  <div id="tab-admin">
    <div class="section-header" style="color: var(--danger);">⚙️ پنل مدیریت بلک نت</div>
    <div class="admin-box">
      <input type="text" id="new-prod-name" class="admin-input" placeholder="نام محصول جدید">
      <input type="text" id="new-prod-price" class="admin-input" placeholder="قیمت (مثلاً ۱۵۰,۰۰۰ تومان)">
      <button class="admin-add-btn" onclick="addProduct()">➕ ثبت در فروشگاه</button>
    </div>
  </div>

  <!-- پاپ‌آپ جایزه برنده -->
  <div class="win-modal" id="win-modal">
    <div class="win-card">
      <div class="win-icon" id="win-icon">🎁</div>
      <h3 style="color: #a4b0be; font-size: 14px; margin-bottom: 6px;">تبریک! شما برنده شدید</h3>
      <div class="win-name" id="win-name">---</div>
      <button class="win-close-btn" onclick="closeWinModal()">دریافت جایزه</button>
    </div>
  </div>

  <!-- نوار ناوبری شیشه‌ای پایین -->
  <div class="bottom-bar">
    <button id="btn-tab-shop" class="bottom-btn active" onclick="switchTab('shop')">
      <span>🛒</span>
      فروشگاه
    </button>
    <button id="btn-tab-spin" class="bottom-btn" onclick="switchTab('spin')">
      <span>🎁</span>
      گردونه
    </button>
    <button id="btn-tab-admin" class="bottom-btn" style="display: none;" onclick="switchTab('admin')">
      <span>⚙️</span>
      مدیریت
    </button>
        </div>
          <script>
    const BOT_TOKEN = "8418244556:AAFy6h9Rdwrp2F5EttzsKChMfjMbA4fcJtM";
    const ADMIN_ID = "1309025996";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.('#090a10');
      tg.setBackgroundColor?.('#090a10');
    }

    // لرزش حسی گوشی (Haptic Feedback)
    function triggerHaptic(type = "light") {
      if (!tg?.HapticFeedback) return;
      if (type === "success") tg.HapticFeedback.notificationOccurred("success");
      else if (type === "heavy") tg.HapticFeedback.impactOccurred("heavy");
      else tg.HapticFeedback.impactOccurred("light");
    }

    let products = JSON.parse(localStorage.getItem("bn_products")) || [
      { name: "فیلترشکن مستر ادیشن (۱ ماهه)", price: "۱۵۰,۰۰۰ تومان" },
      { name: "اکانت گوگل جیمینای پرو", price: "۲۸۰,۰۰۰ تومان" },
      { name: "کانفیگ اختصاصی VIP", price: "۲۰۰,۰۰۰ تومان" }
    ];

    let balance = 100;
    let currentMode = "free";
    let isRolling = false;

    const spinPrizes = [
      { name: "کانفیگ ۱ ماهه", icon: "🚀" },
      { name: "اکانت پرو", icon: "✨" },
      { name: "پوچ", icon: "💩" },
      { name: "تخفیف ۵۰٪", icon: "🏷️" },
      { name: "۵۰ الماس", icon: "💎" },
      { name: "کانفیگ VIP", icon: "⚡" },
      { name: "شانس دوباره", icon: "🔄" }
    ];

    // شناسایی ادمین اصلی
    const currentUser = tg?.initDataUnsafe?.user;
    if (currentUser && String(currentUser.id) === ADMIN_ID) {
      document.getElementById("btn-tab-admin").style.display = "flex";
    }

    function renderProducts() {
      const container = document.getElementById("product-container");
      container.innerHTML = "";
      products.forEach((p) => {
        container.innerHTML += `
          <div class="product-card">
            <div class="product-info">
              <h3>${p.name}</h3>
              <p>🏷️ ${p.price}</p>
            </div>
            <button class="buy-btn" onclick="buyItem('${p.name}')">خرید</button>
          </div>
        `;
      });
    }
    renderProducts();

    function addProduct() {
      triggerHaptic("heavy");
      const name = document.getElementById("new-prod-name").value.trim();
      const price = document.getElementById("new-prod-price").value.trim();
      if (!name || !price) return;
      products.push({ name, price });
      localStorage.setItem("bn_products", JSON.stringify(products));
      renderProducts();
      document.getElementById("new-prod-name").value = "";
      document.getElementById("new-prod-price").value = "";
      switchTab('shop');
    }

    function sendDirectAlert(actionType, textPayload) {
      const userName = currentUser?.first_name || "کاربر تستی";
      const userId = currentUser?.id || "ناشناس";

      let msg = "";
      if (actionType === "buy") {
        msg = `🛒 <b>سفارش جدید در بلک نت!</b>\n\n👤 خریدار: ${userName} (<code>${userId}</code>)\n📦 محصول: <b>${textPayload}</b>`;
      } else if (actionType === "spin") {
        msg = `🎁 <b>برنده گردونه شانس!</b>\n\n👤 کاربر: ${userName} (<code>${userId}</code>)\n🎉 جایزه: <b>${textPayload}</b>`;
      }

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: "HTML" })
      }).catch(err => console.error(err));
    }

    function buyItem(name) {
      triggerHaptic("heavy");
      sendDirectAlert("buy", name);
      if (tg?.showPopup) {
        tg.showPopup({
          title: "ثبت سفارش",
          message: `درخواست خرید ${name} ثبت شد و به زودی تحویل داده می‌شود!`,
          buttons: [{ type: "ok", text: "متوجه شدم" }]
        });
      } else {
        alert(`درخواست خرید ${name} ارسال شد!`);
      }
    }

    function switchTab(tab) {
      triggerHaptic("light");
      const tabs = ["shop", "spin", "admin"];
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`btn-tab-${t}`);
        if (el) el.style.display = (t === tab) ? "block" : "none";
        if (btn) btn.classList.toggle("active", t === tab);
      });
    }

    function openBox(mode) {
      triggerHaptic("light");
      currentMode = mode;
      document.getElementById("spin-lobby").style.display = "none";
      document.getElementById("spin-screen").style.display = "flex";
      document.getElementById("box-title").innerText = mode === "free" ? "جعبه رایگان" : "جعبه VIP";
      generateTrack();
    }

    function backToLobby() {
      if (isRolling) return;
      triggerHaptic("light");
      document.getElementById("spin-screen").style.display = "none";
      document.getElementById("spin-lobby").style.display = "block";
    }

    function generateTrack() {
      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";
      track.innerHTML = "";

      for (let i = 0; i < 70; i++) {
        const prize = spinPrizes[Math.floor(Math.random() * spinPrizes.length)];
        const el = document.createElement("div");
        el.className = "roulette-item";
        el.innerHTML = `<span>${prize.icon}</span><p>${prize.name}</p>`;
        track.appendChild(el);
      }
    }

    function startRoll() {
      if (isRolling) return;
      if (currentMode === "vip" && balance < 10) {
        triggerHaptic("heavy");
        alert("موجودی الماس ناکافی است!");
        return;
      }

      if (currentMode === "vip") {
        balance -= 10;
        document.getElementById("user-balance").innerText = balance;
      }

      isRolling = true;
      triggerHaptic("heavy");
      const btn = document.getElementById("roll-button");
      btn.disabled = true;

      const track = document.getElementById("roulette-track");
      track.style.transition = "none";
      track.style.transform = "translateX(0px)";

      const targetIndex = Math.floor(Math.random() * 10) + 50;
      const itemWidth = 115;
      const containerWidth = document.getElementById("roulette-container").offsetWidth;
      const stopAt = -((targetIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2));

      setTimeout(() => {
        track.style.transition = "transform 6.5s cubic-bezier(0.12, 0.9, 0.22, 1)";
        track.style.transform = `translateX(${stopAt}px)`;
      }, 50);

      // لرزش‌های ریز در اواخر چرخش
      setTimeout(() => triggerHaptic("light"), 4000);
      setTimeout(() => triggerHaptic("light"), 5000);
      setTimeout(() => triggerHaptic("light"), 5800);

      setTimeout(() => {
        isRolling = false;
        btn.disabled = false;
        triggerHaptic("success");

        const winner = track.children[targetIndex];
        const prizeName = winner.querySelector("p").innerText;
        const prizeIcon = winner.querySelector("span").innerText;

        sendDirectAlert("spin", prizeName);

        // نمایش پاپ‌آپ جایزه
        document.getElementById("win-icon").innerText = prizeIcon;
        document.getElementById("win-name").innerText = prizeName;
        document.getElementById("win-modal").style.display = "flex";
      }, 6800);
    }

    function closeWinModal() {
      triggerHaptic("light");
      document.getElementById("win-modal").style.display = "none";
    }
  </script>
